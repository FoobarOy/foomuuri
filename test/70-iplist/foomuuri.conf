zone {
  localhost
  public
}

iplist {
  timeout 1h 2m  # backward compabiliy (v0.27)
  url_refresh=1d2h3m
  @empty
  @empty_no_merge merge=no
  @one    10.0.0.1
  @two    10.0.0.1 ff00::1 /non/existing/file dns_refresh=3h missing_ok=yes
  @three  10.0.0.4 10.0.0.5 ff00::1 /non/existing/file dns_refresh=3h merge=no missing_ok=yes
  @start  10.0.0.6 start=no
  @file   ./iplist.txt url_timeout=1000d  # More than 2 years is never
  @empty_file   ./iplist_empty.txt missing_ok=yes
  @dns    localhost dns_timeout=1000d
}
